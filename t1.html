<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width:100%;
        height:100%;

        opacity: 0;
        transition: .5s ease;
        background-color: #008CBA;
        color:white;

        display:flex;
        justify-content: center;
        padding-bottom: 30px;
        align-items: flex-end;
        box-sizing: border-box;
    }
    .container {
        position: relative;
        border-radius:50%;
        width: 250px;
        height:250px;
        overflow:hidden;
    }
    .container img{
        width:100%;
        height:100%;
        object-fit: hidden;
    }
    .container:hover .overlay {
        opacity: 1;
    }
</style>
</head>
<body>

    <h2>Rounded Images</h2>
    <div class="container">
        <img src="https://www.w3schools.com/howto/img_avatar.png" alt="Avatar">
        <div class="overlay">
            <span>Hello world</span>
        </div>
    </div>

</body>
</html>
